name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (yarn 4 from packageManager field)
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Typecheck core
        run: yarn workspace @tulipes/core typecheck

      - name: Build core
        run: yarn workspace @tulipes/core build

      - name: Smoke-test compiled CLI
        run: node packages/core/dist/cli/bin.js help

      - name: Typecheck the spec generator
        run: yarn workspace @tulipes/spec typecheck

      - name: Codegen + typecheck example against generated types
        run: |
          yarn workspace @tulipes-example/app sync
          yarn workspace @tulipes-example/app typecheck

      # The example carries copies of the agent guides that `tulipes init`
      # ships, so the reference app demonstrates them. Copies drift; this
      # fails the build when they do.
      - name: Agent guides match the shipped templates
        run: |
          diff packages/core/templates/CLAUDE.md example/CLAUDE.md
          diff -r packages/core/templates/claude example/.claude

      # The example IS what `tulipes init` produces, so it exercises exactly
      # what a user gets. Every module must therefore be byte-identical to
      # the scaffold's — except package.json, whose dependency ranges
      # legitimately differ (workspace:* in here, a published range out
      # there). Without this the two drift silently, and the app we test is
      # not the app we ship.
      - name: Example modules match `tulipes init` output
        run: |
          node packages/core/dist/cli/bin.js init "$RUNNER_TEMP/scaffold" >/dev/null
          diff -r -x 'package.json' "$RUNNER_TEMP/scaffold/modules" example/modules
