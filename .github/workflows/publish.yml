name: Publish verified packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a reviewed version tag
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('packages/core/package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
  verify:
    needs: validate-release
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .artifacts
      - name: Verify npm authentication is configured
        env:
          USE_OIDC: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$USE_OIDC" != true ] && [ -z "$NPM_TOKEN" ]; then
            echo 'Configure NPM_TOKEN or both npm trusted publishers and NPM_TRUSTED_PUBLISHING=true' >&2
            exit 1
          fi
      - name: Publish the verified archives
        run: node scripts/artifacts.mjs publish .artifacts
        env:
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
          # npm cannot generate provenance from a private source repository.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
