name: Docs site
on:
  push:
    branches: [master]
    paths: &sources
      - 'site/**'
      - 'packages/*/src/**'
      - 'packages/*/README.md'
      - 'packages/core/CHANGELOG.md'
      - 'packages/core/MIGRATING.md'
      - 'docs/**'
      - 'example/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *sources
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --filter @tulipes-site/docs...
      - run: pnpm --filter @tulipes-site/docs build
      - run: pnpm --filter @tulipes-site/docs check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
