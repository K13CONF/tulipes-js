name: Docs site
on:
  push:
    branches: [master]
    paths: &sources
      - 'site/**'
      - 'packages/*/src/**'
      - 'packages/*/README.md'
      - 'packages/core/CHANGELOG.md'
      - 'packages/core/MIGRATING.md'
      - 'docs/**'
      - 'example/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths: *sources
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # "Last updated" dates come from git history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Full install: the API reference reads every package's types, the CLI reference runs the CLI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tulipes-site/docs build
      - run: pnpm --filter @tulipes-site/docs check
      # Report only until D07 adds --strict.
      - run: pnpm --filter @tulipes-site/docs api:coverage
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
