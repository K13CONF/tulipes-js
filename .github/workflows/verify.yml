name: Verify packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    # ubuntu-24.04 ships kernel 7.0.0, where mongo:8 refuses to start (SERVER-121912; fixed builds need 7.0.14+). Back to ubuntu-latest once it does.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '24']
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/tulipes_tests
      TEST_REDIS_URL: redis://127.0.0.1:6379/3
      REQUIRE_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:types
      - run: pnpm test:coverage
      - run: pnpm --filter @tulipes-example/app sync && pnpm --filter @tulipes-example/app typecheck
      - run: diff packages/cli/templates/AGENTS.md example/AGENTS.md && diff packages/cli/templates/CLAUDE.md example/CLAUDE.md && diff -r packages/cli/templates/claude example/.claude
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
  pack:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/artifacts.mjs prepare .artifacts
      - run: node scripts/audit.mjs reports/workspace-runtime.jsonl --environment production
      - run: |
          node packages/cli/bin/tulipes.js init "$RUNNER_TEMP/scaffold" --preset production > /dev/null
          diff -r -x package.json -x node_modules "$RUNNER_TEMP/scaffold/modules" example/modules
          diff "$RUNNER_TEMP/scaffold/tests/app.test.ts" example/tests/app.test.ts
          diff "$RUNNER_TEMP/scaffold/vitest.config.ts" example/vitest.config.ts
          diff -r "$RUNNER_TEMP/scaffold/nginx" example/nginx
          diff "$RUNNER_TEMP/scaffold/docs/browser-auth.md" example/docs/browser-auth.md
          diff "$RUNNER_TEMP/scaffold/README.md" <(sed "s/tulipes-example/scaffold/; s/ *<!-- feature:[a-z]* -->//" example/README.md)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-audit
          path: reports/
  minimal:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Deliberately no database/Redis services in this job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .artifacts
      - run: node scripts/scaffold-smoke.mjs .artifacts minimal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: minimal-smoke-${{ matrix.os }}
          path: reports/
  offline:
    needs: pack
    runs-on: ubuntu-latest
    # The production preset must also generate specs without services or secrets.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .artifacts
      - run: node scripts/scaffold-smoke.mjs .artifacts production --offline-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-offline-smoke
          path: reports/
  composition:
    needs: pack
    runs-on: ubuntu-latest
    # The production preset without its optional providers must still typecheck
    # and describe itself offline from the same archives.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .artifacts
      - run: node scripts/scaffold-smoke.mjs .artifacts production --no-queues --no-sockets --offline-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: composition-smoke
          path: reports/
  upgrade:
    needs: pack
    runs-on: ubuntu-latest
    # The last published production starter, refused with migration diagnostics
    # and then migrated per MIGRATING.md; no services, network only for the old archive.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .artifacts
      - run: node scripts/upgrade-smoke.mjs .artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upgrade-smoke
          path: reports/
  production:
    needs: pack
    # ubuntu-24.04 ships kernel 7.0.0, where mongo:8 refuses to start (SERVER-121912; fixed builds need 7.0.14+). Back to ubuntu-latest once it does.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/tulipes_smoke
      TEST_REDIS_URL: redis://127.0.0.1:6379/4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: .artifacts
      - run: node scripts/scaffold-smoke.mjs .artifacts production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-smoke
          path: reports/
