# {{DOMAIN}} — rendered from nginx/development.conf by scripts/deploy-nginx.ts.
#
# Development rarely needs nginx at all: `pnpm dev` already serves on
# {{PORT}}. This exists so the proxy layer itself can be exercised locally —
# websocket upgrades and forwarded headers behave differently through a
# proxy, and finding that out in staging is finding out late.
#
# The deploy script refuses while core.publicDomain is still "localhost", so
# using this means pointing a real hostname at the machine first.

server {
    listen 80;
    server_name {{DOMAIN}};

    access_log /var/log/nginx/{{DOMAIN}}.access.log;
    error_log  /var/log/nginx/{{DOMAIN}}.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Single public ingress: overwrite client-supplied forwarding headers.
        # For this local upstream, set TRUST_PROXY_CIDRS=127.0.0.1/32.
        #
        # That trust is only as good as the port below: the app binds every
        # interface, so if {{PORT}} is reachable from outside this host a
        # client can skip nginx entirely — no client_max_body_size, no TLS —
        # and anything on the host can state its own X-Forwarded-For. Firewall
        # the port to loopback, or run the app where the platform does it.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
