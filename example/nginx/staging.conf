# {{DOMAIN}} — rendered from nginx/staging.conf by scripts/deploy-nginx.ts.
# Placeholders are substituted at deploy time; edit this template, never the
# copy in /etc/nginx/sites-available.
#
# Identical to production except for the noindex header below.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    access_log /var/log/nginx/{{DOMAIN}}.access.log;
    error_log  /var/log/nginx/{{DOMAIN}}.error.log;

    # Staging must never reach a search index, even if a link leaks.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:{{PORT}};
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Single public ingress: overwrite client-supplied forwarding headers.
        # For this local upstream, set TRUST_PROXY_CIDRS=127.0.0.1/32.
        #
        # That trust is only as good as the port below: the app binds every
        # interface, so if {{PORT}} is reachable from outside this host a
        # client can skip nginx entirely — no client_max_body_size, no TLS —
        # and anything on the host can state its own X-Forwarded-For. Firewall
        # the port to loopback, or run the app where the platform does it.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# TLS: see nginx/production.conf — same block, same reason it ships
# commented out.
